<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SyncItUp</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div class="card" style="max-width: 450px; width: 100%;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="nav-logo" style="font-size: 2rem; margin-bottom: 0.5rem;">⚡ SyncItUp</div>
                <h2 style="margin-bottom: 0.5rem;">Welcome Back!</h2>
                <p style="color: var(--text-secondary);">Login to find your perfect teammates</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="you@college.edu">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <div id="errorMessage" class="hidden"
                    style="padding: 0.75rem; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem;">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;" id="loginBtn">
                    Login
                </button>

                <p style="text-align: center; color: var(--text-secondary);">
                    Don't have an account? <a href="signup.html"
                        style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Sign up</a>
                </p>

                <p
                    style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); color: var(--text-tertiary); font-size: 0.875rem;">
                    <strong>Demo Account:</strong> priya@example.com / password123
                </p>
            </form>
        </div>
    </div>

    <div class="theme-toggle" id="themeToggle" style="position: fixed; top: 1rem; right: 1rem;"></div>

    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
