<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SyncItUp</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div class="card" style="max-width: 550px; width: 100%;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="nav-logo" style="font-size: 2rem; margin-bottom: 0.5rem;">⚡ SyncItUp</div>
                <h2 style="margin-bottom: 0.5rem;">Create Account</h2>
                <p style="color: var(--text-secondary);">Join the collaboration revolution</p>
            </div>

            <form id="signupForm">
                <div class="grid grid-2" style="gap: 1rem;">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="you@college.edu">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="At least 6 characters">
                </div>

                <div class="grid grid-2" style="gap: 1rem;">
                    <div class="form-group">
                        <label for="college">College</label>
                        <input type="text" id="college" name="college" required placeholder="IIT Delhi">
                    </div>

                    <div class="form-group">
                        <label for="branch">Branch</label>
                        <input type="text" id="branch" name="branch" required placeholder="Computer Science">
                    </div>
                </div>

                <div class="form-group">
                    <label for="year">Year</label>
                    <select id="year" name="year" required>
                        <option value="">Select Year</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bio">Bio (Optional)</label>
                    <textarea id="bio" name="bio" placeholder="Tell us about yourself and your interests..."></textarea>
                </div>

                <div id="errorMessage" class="hidden"
                    style="padding: 0.75rem; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem;">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;" id="signupBtn">
                    Create Account
                </button>

                <p style="text-align: center; color: var(--text-secondary);">
                    Already have an account? <a href="login.html"
                        style="color: var(--primary-color); font-weight: 600; text-decoration: none;">Login</a>
                </p>
            </form>
        </div>
    </div>

    <div class="theme-toggle" id="themeToggle" style="position: fixed; top: 1rem; right: 1rem;"></div>

    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
